name: Build PS3 Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PS3DEV: /usr/local/ps3dev
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y make git python3 libelf-dev libssl-dev zlib1g-dev

      - name: Baixar SDK PS3DEV Pronto
        run: |
          sudo mkdir -p /usr/local/ps3dev
          gh release download -R bucanero/ps3toolchain -p "*ubuntu*" -D /tmp
          sudo tar -xzf /tmp/*ubuntu* -C /usr/local/ps3dev --strip-components=1
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH
          PSL1GHT_DIR=$(dirname $(find /usr/local/ps3dev -name "Makefile.base" | head -n 1))
          echo "PSL1GHT encontrado em: $PSL1GHT_DIR"
          echo "PSL1GHT=$PSL1GHT_DIR" >> $GITHUB_ENV

      - name: Compilar Jogo PS3
        run: make -j$(nproc)

      - name: Preparar Artefatos
        run: |
          mkdir -p artifacts
          cp *.pkg *.self *.bin artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Enviar Arquivos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: spacesim-ps3-build
          path: artifacts/
          retention-days: 30
