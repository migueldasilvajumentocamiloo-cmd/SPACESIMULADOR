name: Build PS3 Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev/psl1ght
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y make git python3 libelf-dev libssl-dev zlib1g-dev

      - name: Baixar Compilador PS3DEV
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev
          gh release download -R bucanero/ps3toolchain -p "*ubuntu*" -D /tmp
          tar -xzf /tmp/*ubuntu* -C /usr/local/ps3dev --strip-components=1
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Instalar PSL1GHT e Tiny3D
        run: |
          export PATH="$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin"
          gh repo clone ps3dev/PSL1GHT /tmp/psl1ght
          make -C /tmp/psl1ght install-ctrl
          make -C /tmp/psl1ght
          make -C /tmp/psl1ght install
          gh repo clone wargio/tiny3D /tmp/tiny3d
          make -C /tmp/tiny3d
          find /tmp/tiny3d -name "*.a" -exec cp {} /usr/local/ps3dev/ppu/lib/ \;
          find /tmp/tiny3d -name "tiny3d.h" -exec cp {} /usr/local/ps3dev/ppu/include/ \;

      - name: Compilar Jogo PS3
        run: make -j$(nproc)

      - name: Preparar Artefato — Só o .pkg
        run: |
          mkdir -p artifacts
          cp *.pkg artifacts/ 2>/dev/null || true

      - name: Baixar Jogo
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSim-PS3
          path: artifacts/
          retention-days: 30
