name: Build PS3 Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: wargio/ps3sdk-docker:latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Verificar Ambiente
        run: |
          echo "PS3DEV: $PS3DEV"
          echo "PSL1GHT: $PSL1GHT"
          ppu-gcc --version

      - name: Compilar Projeto
        run: make -j$(nproc)

      - name: Preparar Artefatos
        run: |
          mkdir -p artifacts
          cp *.pkg *.self *.bin artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Enviar Arquivos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: spacesim-ps3-build
          path: artifacts/
          retention-days: 30
