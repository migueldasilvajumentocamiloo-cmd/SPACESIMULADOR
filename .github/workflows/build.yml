name: Build PS3 Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev/psl1ght
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y make git python3 python3-pil libelf-dev libssl-dev zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev

      - name: Baixar Compilador PS3DEV
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev
          gh release download -R bucanero/ps3toolchain -p "*ubuntu*" -D /tmp
          tar -xzf /tmp/*ubuntu* -C /usr/local/ps3dev --strip-components=1
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Instalar PSL1GHT e Tiny3D
        run: |
          export PATH="$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin"
          gh repo clone ps3dev/PSL1GHT /tmp/psl1ght
          make -C /tmp/psl1ght install-ctrl
          make -C /tmp/psl1ght
          make -C /tmp/psl1ght install
          
          # Corrigir print e exceções antigas em sfo.py e pkg.py para Python 3
          python3 -c '
          import glob, re
          for path in glob.glob("/usr/local/ps3dev/bin/*.py"):
              txt = open(path, "r", errors="ignore").read()
              txt = re.sub(r"^(\s*)print\s+(?!\()(.+)$", r"\1print(\2)", txt, flags=re.M)
              txt = re.sub(r"except\s+([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+):", r"except \1 as \2:", txt)
              open(path, "w").write(txt)
          '
          
          # Compatibilidade de headers PSL1GHT v1 -> v2
          INC_DIR=$(dirname $(find /usr/local/ps3dev -name "ppu-types.h" | head -n 1))
          mkdir -p "$INC_DIR/psl1ght"
          ln -sf "$INC_DIR/ppu-types.h" "$INC_DIR/psl1ght/types.h"
          for f in "$INC_DIR"/*.h; do ln -sf "$f" "$INC_DIR/psl1ght/$(basename "$f")"; done
          
          gh repo clone wargio/tiny3D /tmp/tiny3d
          make -C /tmp/tiny3d
          mkdir -p /usr/local/ps3dev/portlibs/ppu/lib /usr/local/ps3dev/portlibs/ppu/include
          find /tmp/tiny3d -name "*.a" -exec cp {} /usr/local/ps3dev/portlibs/ppu/lib/ \;
          find /tmp/tiny3d -name "*.h" -exec cp {} /usr/local/ps3dev/portlibs/ppu/include/ \;

      - name: Criar ICON0.PNG se não existir
        run: |
          if [ ! -f ICON0.PNG ]; then
            python3 -c "from PIL import Image; Image.new('RGBA', (320, 176), (20, 30, 60, 255)).save('ICON0.PNG')"
          fi

      - name: Compilar Jogo PS3
        run: make -j$(nproc)

      - name: Preparar Artefato — Só o .pkg
        run: |
          mkdir -p artifacts
          cp *.pkg artifacts/

      - name: Baixar Jogo
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSim-PS3
          path: artifacts/*.pkg
          retention-days: 30
          if-no-files-found: error
