name: Build PS3 Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev/psl1ght

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar gzip make git python3 libelf-dev libssl-dev zlib1g-dev

      - name: Baixar Toolchain PS3DEV Pré-compilado
        run: |
          sudo mkdir -p /usr/local/ps3dev
          wget -q https://github.com -O /tmp/ps3dev.tar.gz
          sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local/ps3dev --strip-components=1
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Instalar Tiny3D
        run: |
          export PATH="/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:$PATH"
          git clone https://github.com /tmp/tiny3d
          make -C /tmp/tiny3d/library install

      - name: Compilar Projeto
        run: |
          export PATH="/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:$PATH"
          make -j$(nproc)

      - name: Preparar Artefatos
        run: |
          mkdir -p artifacts
          cp *.pkg *.self *.bin artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Enviar Arquivos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: spacesim-ps3-build
          path: artifacts/
          retention-days: 30
